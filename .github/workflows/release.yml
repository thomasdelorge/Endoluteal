name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "ERROR: tag $TAG does not match versionName $VERSION (expected $EXPECTED)."
            exit 1
          fi
          if echo "$TAG" | grep -qE '-(rc|beta|alpha|dev)'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up release signing credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat <<EOF > keystore.properties
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build clean release APK
        run: ./gradlew clean assembleRelease --no-build-cache

      - name: Verify release APK and signature
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            exit 1
          fi

          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"
          RELEASE_APK="$DIST_DIR/endoluteal-v${VERSION}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | awk '{print $1}' > "$RELEASE_APK.sha256"

          echo "Release APK SHA-256:"
          cat "$RELEASE_APK.sha256"

          echo "Verifying APK signing certificate:"
          APKSIGNER=$(find "$ANDROID_HOME"/build-tools -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: No CHANGELOG section for [$VERSION]."
            exit 1
          fi

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/endoluteal-*.apk
            dist/endoluteal-*.apk.sha256
          body_path: release-notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
